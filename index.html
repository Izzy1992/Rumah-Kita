      function handleRoomLockRequests(ch) {
        const nearToilet = ch.path.some(pt => {
          const tc = Math.floor(pt.x / TILE);
          const tr = Math.floor(pt.y / TILE);
          return tc >= 60 && tc <= 64 && tr >= 27 && tr <= 38;
        });
        if (nearToilet && SINGLE_LOCKS.toilet.occupant && SINGLE_LOCKS.toilet.occupant !== ch.id) {
          if (!SINGLE_LOCKS.toilet.queue.includes(ch.id)) SINGLE_LOCKS.toilet.queue.push(ch.id);
          const qIdx = SINGLE_LOCKS.toilet.queue.indexOf(ch.id);
          const spot = SINGLE_LOCKS.toilet.waitSpots[qIdx % SINGLE_LOCKS.toilet.waitSpots.length];
          ch.path = computeAStarPath(Math.floor(ch.x / TILE), Math.floor(ch.y / TILE), spot.c, spot.r, false, ch.id);
          ch.activity = 'Menunggu giliran di luar Tandas';
          ch.thought = 'Tunggu sebentar, ada ahli keluarga di dalam tandas.';
          return;
        }

        const curC = Math.floor(ch.x / TILE);
        const curR = Math.floor(ch.y / TILE);
        if (curC >= 60 && curC <= 64 && curR >= 27 && curR <= 38 && !SINGLE_LOCKS.toilet.occupant) {
          SINGLE_LOCKS.toilet.occupant = ch.id;
          ch.lockType = 'toilet';
        } else if (!(curC >= 60 && curC <= 64 && curR >= 27 && curR <= 38) && SINGLE_LOCKS.toilet.occupant === ch.id) {
          SINGLE_LOCKS.toilet.occupant = null;
          ch.lockType = null;
          if (SINGLE_LOCKS.toilet.queue.length > 0) {
            const nextId = SINGLE_LOCKS.toilet.queue.shift();
            const nextCh = characters.find(x => x.id === nextId);
            if (nextCh && nextCh.active && nextCh.visible) {
              setCharacterActivity(nextCh, 'Masuk ke Tandas', 'hygiene', 62, 32, false, 'idle', 6);
            }
          }
        }

        const nearBath = ch.path.some(pt => {
          const tc = Math.floor(pt.x / TILE);
          const tr = Math.floor(pt.y / TILE);
          return tc >= 66 && tc <= 71 && tr >= 27 && tr <= 38;
        });
        if (nearBath && SINGLE_LOCKS.bathroom.occupant && SINGLE_LOCKS.bathroom.occupant !== ch.id) {
          if (!SINGLE_LOCKS.bathroom.queue.includes(ch.id)) SINGLE_LOCKS.bathroom.queue.push(ch.id);
          const qIdx = SINGLE_LOCKS.bathroom.queue.indexOf(ch.id);
          const spot = SINGLE_LOCKS.bathroom.waitSpots[qIdx % SINGLE_LOCKS.bathroom.waitSpots.length];
          ch.path = computeAStarPath(curC, curR, spot.c, spot.r, false, ch.id);
          ch.activity = 'Menunggu giliran di luar Bilik Mandi';
          ch.thought = 'Giliran mandi selepas ini.';
          return;
        }

        if (curC >= 66 && curC <= 71 && curR >= 27 && curR <= 38 && !SINGLE_LOCKS.bathroom.occupant) {
          SINGLE_LOCKS.bathroom.occupant = ch.id;
          ch.lockType = 'bathroom';
        } else if (!(curC >= 66 && curC <= 71 && curR >= 27 && curR <= 38) && SINGLE_LOCKS.bathroom.occupant === ch.id) {
          SINGLE_LOCKS.bathroom.occupant = null;
          ch.lockType = null;
          if (SINGLE_LOCKS.bathroom.queue.length > 0) {
            const nextId = SINGLE_LOCKS.bathroom.queue.shift();
            const nextCh = characters.find(x => x.id === nextId);
            if (nextCh && nextCh.active && nextCh.visible) {
              setCharacterActivity(nextCh, 'Masuk ke Bilik Mandi', 'hygiene', 68, 31, false, 'idle', 7);
            }
          }
        }
      }

      function setCharacterActivity(ch, label, activityKey, goalC, goalR, swimGoal = false, mode = 'walk', duration = 8) {
        // Semasa rutin keluarga (mandi pagi / makan bersama) sistem lain tidak boleh mengalihkan watak.
        // Pengecualian: rutin itu sendiri, giliran bilik mandi, pelawat yang pulang & Papa bertolak kerja.
        if (ch.routineLock && !ch.routineBypass && !ch.leavingHome && ch.carPhase !== 'boarding_out' && activityKey !== 'hygiene') return;
        if (FAMILY.bayi.includes(ch.id) && swimGoal) {
          swimGoal = false;
          goalC = 59;
          goalR = 47;
          label = 'Duduk di tepi kolam bersama orang dewasa';
          activityKey = 'poolside';
          mode = 'idle';
        }

        const startC = Math.max(1, Math.min(COLS - 2, Math.floor(ch.x / TILE)));
        const startR = Math.max(1, Math.min(ROWS - 2, Math.floor(ch.y / TILE)));
        const prevAct = ch.activity;
        const prevActivityKey = ch.activityKey;
        const sleepRequested = activityKey === 'sleep' || mode === 'sleep';
        if (prevActivityKey && prevActivityKey !== activityKey && !ch.isPet) {
          ch.activityHistory = Array.isArray(ch.activityHistory) ? ch.activityHistory : [];
          ch.activityHistory.push({ key: prevActivityKey, day: timeState.dayNumber, minute: Math.floor(timeState.virtualMinutes % 1440), label: prevAct || prevActivityKey });
          // Simpan memori aktiviti secara ringan; hanya sejarah pendek diperlukan untuk anti-pengulangan.
          if (ch.activityHistory.length > 12) ch.activityHistory.splice(0, ch.activityHistory.length - 12);
        }
        ch.chosenActivityAt = { day: timeState.dayNumber, minute: Math.floor(timeState.virtualMinutes % 1440) };
        ch.chosenActivityReason = activityKey;
        ch.activityKey = activityKey;
        ch.activity = label;
        ch.actionMode = sleepRequested ? 'walk' : mode;
        ch.pendingSleep = sleepRequested;
        ch.sleepRetry = 0;
        ch.sleepTarget = sleepRequested ? { x: (goalC + 0.5) * TILE, y: (goalR + 0.5) * TILE } : null;
        ch.timer = duration;

        if (swimGoal) {
          const toLadder = computeAStarPath(startC, startR, POOL.ladderC, POOL.ladderR, ch.swimming, ch.id);
          const insidePool = [
            { x: (POOL.entryC + 0.5) * TILE, y: (POOL.entryR + 0.5) * TILE },
            { x: (goalC + 0.5) * TILE, y: (goalR + 0.5) * TILE }
          ];
          ch.path = toLadder.concat(insidePool);
        } else {
          if (ch.swimming && grid[idx(goalC, goalR)] !== CELL_POOL) {
            const exitPt = { x: (POOL.ladderC + 0.5) * TILE, y: (POOL.ladderR + 0.5) * TILE };
            const restPath = computeAStarPath(POOL.ladderC, POOL.ladderR, goalC, goalR, false, ch.id);
            ch.path = [exitPt].concat(restPath);
          } else {
            ch.path = computeAStarPath(startC, startR, goalC, goalR, ch.swimming, ch.id);
          }
        }

        handleRoomLockRequests(ch);
        ch.thought = generateThought(ch);
        if (prevAct !== label && !ch.isPet) {
          addMemory(ch, label);
        }
      }

      function updateNeedsAndMood(ch, dt, effectiveTimeScale) {
        if (!ch.active || !ch.visible) return;
        const virtualHours = (dt * effectiveTimeScale) / 3600; // dt dalam saat sebenar, scale dalam minit virtual / minit sebenar
        const prof = PROFILES[ch.id] || { ageYears: 25 };
        const isKid = prof.ageYears < 13;

        if (ch.actionMode === 'eat') {
          ch.needs.lapar = Math.max(0, ch.needs.lapar - 45 * virtualHours);
        } else {
          ch.needs.lapar = Math.min(100, ch.needs.lapar + NEED_RATES.lapar * virtualHours);
        }

        if (ch.actionMode === 'sleep') {
          ch.needs.tenaga = Math.min(100, ch.needs.tenaga + 22 * virtualHours);
        } else if (ch.activityKey === 'rest') {
          ch.needs.tenaga = Math.min(100, ch.needs.tenaga + 10 * virtualHours);
        } else {
          ch.needs.tenaga = Math.max(5, ch.needs.tenaga + NEED_RATES.tenaga * virtualHours);
        }

        if (ch.actionMode === 'play' || ch.actionMode === 'swim' || ch.activityKey === 'story' || ch.activityKey === 'tv') {
          ch.needs.hiburan = Math.min(100, ch.needs.hiburan + 28 * virtualHours);
        } else {
          const rate = isKid ? NEED_RATES.hiburanKanak : NEED_RATES.hiburanDewasa;
          ch.needs.hiburan = Math.max(5, ch.needs.hiburan + rate * virtualHours);
        }

        const nearbyOthers = characters.filter(o => o.id !== ch.id && o.active && o.visible && Math.hypot(o.x - ch.x, o.y - ch.y) < 5 * TILE);
        if (nearbyOthers.length > 0) {
          ch.needs.sosial = Math.min(100, ch.needs.sosial + 14 * virtualHours);
        } else {
          ch.needs.sosial = Math.max(5, ch.needs.sosial + NEED_RATES.sosial * virtualHours);
        }

        if (ch.activityKey === 'hygiene' || ch.swimming) {
          ch.needs.kebersihan = Math.min(100, ch.needs.kebersihan + 40 * virtualHours);
        } else {
          ch.needs.kebersihan = Math.max(10, ch.needs.kebersihan + NEED_RATES.kebersihan * virtualHours);
        }

        if (ch.isCrying) {
          ch.mood = -0.85;
        } else if (ch.poutTimer > 0) {
          ch.mood = -0.65;
        } else {
          const wellBeing = (
            (100 - ch.needs.lapar) * 0.26 +
            ch.needs.tenaga * 0.26 +
            ch.needs.hiburan * 0.20 +
            ch.needs.sosial * 0.16 +
            ch.needs.kebersihan * 0.12
          ) / 100;
          const targetMood = Math.max(-0.8, Math.min(0.95, (wellBeing - 0.45) * 1.8));
          ch.mood += (targetMood - ch.mood) * Math.min(1, dt * 1.5);
        }
      }

      function updateCharacter(ch, dt, effectiveTimeScale) {
        if (!ch.active || !ch.visible) return;

        if (ch.id === 'papa' && ch.carPhase === 'boarding_out' && ch.path.length === 0) {
          ch.carPhase = 'at_work';
          ch.visible = false;
          familyCar.state = 'driving_out';
          openFrontGate(4.5);
          setTicker('Papa masuk ke kereta & memandu keluar ke tempat kerja (Isnin–Jumaat, 9 AM - 6 PM).');
          return;
        }

        updateNeedsAndMood(ch, dt, effectiveTimeScale);
        ch.thoughtRefreshTimer = (ch.thoughtRefreshTimer || 0) + dt;
        if (ch.thoughtRefreshTimer >= 10) {
          ch.thoughtRefreshTimer = 0;
          ch.thought = generateThought(ch);
        }

        const prof = PROFILES[ch.id] || { moveSpeedMult: 1.0 };
        const speedMult = prof.moveSpeedMult || 1.0;

        if (ch.path && ch.path.length > 0) {
          const baseSpeed = ch.swimming ? ch.speed * 0.72 : ch.speed;
          const stepSpeed = baseSpeed * speedMult;
          // Gerakan berterusan: baki jarak dibawa ke waypoint seterusnya (tiada 'snap' / lompatan kecil
          // di setiap petak), dan fasa animasi mengikut jarak sebenar yang dilalui.
          let remaining = stepSpeed * dt;
          const startX = ch.x, startY = ch.y;
          let loopGuard = 0;
          while (remaining > 0 && ch.path.length > 0 && loopGuard++ < 6) {
            const target = ch.path[0];
            const dx = target.x - ch.x;
            const dy = target.y - ch.y;
            const dist = Math.hypot(dx, dy);
            if (Math.abs(dx) > 3) ch.facing = dx >= 0 ? 1 : -1; // hysteresis: elak pusing kiri-kanan
            if (dist <= remaining) {
              ch.x = target.x;
              ch.y = target.y;
              remaining -= dist;
              ch.path.shift();
            } else {
              const nextX = ch.x + (dx / dist) * remaining;
              const nextY = ch.y + (dy / dist) * remaining;
              if (!isPointBlockedBySolidObject(nextX, nextY, ch.id)) {
                ch.x = nextX;
                ch.y = nextY;
              } else {
                ch.path.shift();
              }
              remaining = 0;
            }
          }
          ch.animPhase += Math.hypot(ch.x - startX, ch.y - startY) * 0.131;

          const c = Math.max(0, Math.min(COLS - 1, Math.floor(ch.x / TILE)));
          const r = Math.max(0, Math.min(ROWS - 1, Math.floor(ch.y / TILE)));
          ch.swimming = grid[idx(c, r)] === CELL_POOL;
        } else {
          const c = Math.max(0, Math.min(COLS - 1, Math.floor(ch.x / TILE)));
          const r = Math.max(0, Math.min(ROWS - 1, Math.floor(ch.y / TILE)));
          ch.swimming = grid[idx(c, r)] === CELL_POOL;

          if (ch.pendingSleep) {
            const target = ch.sleepTarget;
            const distToBed = target ? Math.hypot(ch.x - target.x, ch.y - target.y) : 0;
            // Katil ialah objek pepejal: A* berhenti di petak terdekat yang boleh dicapai, jadi terima
            // kedudukan dalam lingkungan ~3.5 petak selepas beberapa percubaan tanpa laluan lebih dekat.
            ch.sleepRetry = (ch.sleepRetry || 0) + 1;
            const arrived = target && (distToBed <= TILE * 0.8 || (distToBed <= TILE * 3.5 && ch.sleepRetry >= 3));
            if (arrived) {
              ch.pendingSleep = false;
              ch.actionMode = 'sleep';
              ch.timer = Math.max(ch.timer, 10);
              ch.thought = generateThought(ch);
              if (!ch.isPet) addMemory(ch, 'Sampai ke katil dan mula tidur.');
            } else if (target) {
              // Failed/empty path must not cause sleep in place. Retry toward the bed.
              const startC = Math.max(1, Math.min(COLS - 2, Math.floor(ch.x / TILE)));
              const startR = Math.max(1, Math.min(ROWS - 2, Math.floor(ch.y / TILE)));
              const goalC = Math.floor(target.x / TILE), goalR = Math.floor(target.y / TILE);
              const retry = computeAStarPath(startC, startR, goalC, goalR, false, ch.id);
              if (retry.length) ch.path = retry;
              else {
                ch.activity = 'Mencari laluan ke katil';
                ch.actionMode = 'walk';
                ch.timer = Math.max(ch.timer, 2);
              }
            } else {
              ch.pendingSleep = false;
              ch.actionMode = 'idle';
            }
          } else {
            ch.timer -= dt;
            if (ch.timer <= 0) chooseNextActivityForCharacter(ch);
          }
        }
      }

      function toggleVisitorArrival(id, forceState = null) {
        const ent = characters.find(c => c.id === id);
        if (!ent) return;

        if (isNightAcceleratedActive()) {
          ent.wantsToVisit = forceState !== null ? forceState : !ent.wantsToVisit;
          setTicker(`Sudah lewat malam, ${ent.name} datang esok pagi.`);
          renderDrawer();
          return;
        }

        const nextActive = forceState !== null ? forceState : !ent.active;
        ent.wantsToVisit = nextActive;
        ent.active = nextActive;
        ent.visible = nextActive;
        ent.leavingHome = false;

        if (ent.active) {
          if (ent.isPet) {
            ent.x = 30 * TILE;
            ent.y = 49 * TILE;
          } else {
            ent.x = (17 + (Math.abs(ent.id.charCodeAt(0)) % 6)) * TILE;
            ent.y = 59 * TILE;
            openFrontGate(4.2);
          }
          ent.isCrying = false;
          ent.unsupervisedSec = 0;
          addMemory(ent, 'Tiba di Rumah Kita.');
          chooseNextActivityForCharacter(ent);
          setTicker(`${ent.emoji} ${ent.name} (${ent.age}) tiba di Rumah Kita!`);
        } else {
          releaseRoomLock(ent.id);
          ent.path = [];
          ent.isCrying = false;
          setTicker(`${ent.emoji} ${ent.name} keluar / pulang.`);
        }
      }


      /* =========================================================================
         RUTIN KELUARGA: (1) bangun tidur -> mandi & memberus gigi, (2) makan bersama
         ========================================================================= */
      const ROUTINE_ROOMS = {
        toilet:   { rect: { c1: 60, r1: 27, c2: 64, r2: 38 }, lock: SINGLE_LOCKS.toilet,   enter: { c: 62, r: 32 }, name: 'Tandas' },
        bathroom: { rect: { c1: 66, r1: 27, c2: 71, r2: 38 }, lock: SINGLE_LOCKS.bathroom, enter: { c: 68, r: 31 }, name: 'Bilik Mandi' }
      };
      // Urutan selepas bangun tidur. Ubah/tambah langkah di sini (dur = saat simulasi; 1 saat ~ 8 minit virtual).
      const WAKE_ROUTINE_STEPS = [
        { key: 'teeth',  room: 'toilet',   label: 'Ke Tandas, memberus gigi selepas bangun', c: 62, r: 32, dur: 1.8 },
        { key: 'shower', room: 'bathroom', label: 'Mandi pagi di Bilik Mandi',               c: 68, r: 31, dur: 2.8 }
      ];
      // start/hardEnd dalam jam (24j). hardEndWork = tamat paksa pada hari bekerja (Papa bertolak 9 AM).
      const MEAL_EVENTS = [
        { key: 'breakfast', label: 'sarapan',          start: 7.0,  hardEnd: 12.0, hardEndWork: 12.0,  eatSec: 6 },
        { key: 'lunch',     label: 'makan tengah hari', start: 12.5, hardEnd: 15.0, hardEndWork: 15.0, eatSec: 7 },
        { key: 'dinner',    label: 'makan malam',       start: 18.5, hardEnd: 20.9, hardEndWork: 20.9, eatSec: 8 }
      ];
      const MEAL_SEATS = [
        { c: 45, r: 16 }, { c: 43, r: 17 }, { c: 45, r: 18 }, { c: 47, r: 18 },
        { c: 44, r: 16 }, { c: 47, r: 16 }, { c: 42, r: 17 }, { c: 48, r: 17 },
        { c: 43, r: 16 }, { c: 46, r: 16 }, { c: 44, r: 18 }, { c: 46, r: 18 },
        { c: 42, r: 18 }, { c: 48, r: 18 }, { c: 49, r: 17 }, { c: 41, r: 17 }
      ];
      const GATHER_MAX_WAIT = 8;    // saat simulasi menunggu ahli yang masih mandi
      const ROUTINE_SAFETY_MAX = 90; // saat simulasi; pelepas keselamatan jika watak tersangkut
      const mealState = { phase: 'idle', event: null, key: '', t: 0, members: {}, seatIdx: 0, done: {} };

      function routineGo(ch, label, key, c, r, mode, dur) {
        ch.routineBypass = true;
        try { setCharacterActivity(ch, label, key, c, r, false, mode, dur); }
        finally { ch.routineBypass = false; }
      }

      function isInsideRect(ch, rc) {
        const c = Math.floor(ch.x / TILE), r = Math.floor(ch.y / TILE);
        return c >= rc.c1 && c <= rc.c2 && r >= rc.r1 && r <= rc.r2;
      }

      function clearRoutine(ch, restart) {
        ch.routine = null;
        ch.routineLock = false;
        ch.routineLockT = 0;
        if (mealState.members[ch.id]) delete mealState.members[ch.id];
        if (restart && ch.active && ch.visible && !ch.leavingHome) chooseNextActivityForCharacter(ch);
      }

      /* ---------- (1) Bangun tidur ---------- */
      function startWakeRoutine(ch) {
        ch.routineLock = true;
        ch.routineLockT = 0;
        ch.pendingSleep = false;
        ch.sleepTarget = null;
        ch.routine = { type: 'wake', step: 0, phase: 'go', t: 0, retry: 0 };
        spawnBubble(ch, 'Bangun... ke tandas, gosok gigi & mandi dulu.');
        addMemory(ch, 'Bangun tidur dan terus ke Tandas untuk memberus gigi, kemudian mandi di Bilik Mandi.');
        beginWakeStep(ch);
      }

      function beginWakeStep(ch) {
        const step = WAKE_ROUTINE_STEPS[ch.routine.step];
        ch.routine.phase = 'go';
        ch.routine.retry = 1.5;
        routineGo(ch, step.label, 'hygiene', step.c, step.r, 'idle', step.dur + 6);
      }

      function updateWakeRoutine(ch, dt) {
        const rt = ch.routine;
        const step = WAKE_ROUTINE_STEPS[rt.step];
        const room = ROUTINE_ROOMS[step.room];
        rt.retry = Math.max(0, rt.retry - dt);
        if (rt.phase === 'go') {
          const L = room.lock;
          // Jika bilik sedang digunakan orang lain, beratur di luar (bukan masuk bersama-sama).
          if (L.occupant && L.occupant !== ch.id && !isInsideRect(ch, room.rect) && !L.queue.includes(ch.id) &&
              ch.path.some(pt => isInsideRect({ x: pt.x, y: pt.y }, room.rect))) {
            L.queue.push(ch.id);
            const spot = L.waitSpots[(L.queue.length - 1) % L.waitSpots.length];
            ch.path = computeAStarPath(Math.floor(ch.x / TILE), Math.floor(ch.y / TILE), spot.c, spot.r, false, ch.id);
            ch.activity = `Menunggu giliran di luar ${room.name}`;
          }
          if (ch.path.length === 0) {
            if (isInsideRect(ch, room.rect)) {
              rt.phase = 'do';
              rt.t = step.dur;
              ch.activity = step.label;
              ch.activityKey = 'hygiene';
              ch.actionMode = 'idle';
              ch.timer = step.dur + 1;
            } else if (!L.queue.includes(ch.id) && rt.retry <= 0) {
              rt.retry = 1.5;
              routineGo(ch, step.label, 'hygiene', step.c, step.r, 'idle', step.dur + 6);
            }
          }
        } else {
          rt.t -= dt;
          if (rt.t <= 0) {
            rt.step++;
            if (rt.step >= WAKE_ROUTINE_STEPS.length) finishWakeRoutine(ch);
            else beginWakeStep(ch);
          }
        }
      }

      function finishWakeRoutine(ch) {
        if (ch.needs) ch.needs.kebersihan = 100;
        addMemory(ch, 'Selesai mandi dan memberus gigi, segar untuk memulakan hari.');
        ch.routine = null;
        ch.routineLock = false;
        ch.routineLockT = 0;
        const m = mealState.members[ch.id];
        if (mealState.phase !== 'idle' && m) sendToSeat(ch, m);
        else chooseNextActivityForCharacter(ch);
      }

      /* ---------- (2) Makan bersama ---------- */
      function isEligibleForMeal(ch) {
        if (!ch.active || !ch.visible || ch.isPet || ch.leavingHome) return false;
        if (ch.actionMode === 'sleep' || ch.pendingSleep) return false;
        if (ch.id === 'papa' && ch.carPhase && ch.carPhase !== 'at_home') return false;
        return true;
      }

      function startMeal(ev, key) {
        const ms = mealState;
        ms.phase = 'gather';
        ms.event = ev;
        ms.key = key;
        ms.done[key] = true;
        ms.served = {};
        ms.t = 0;
        ms.members = {};
        ms.seatIdx = 0;
        characters.forEach(ch => { if (isEligibleForMeal(ch)) addMealMember(ch); });
        const mama = characters.find(c => c.id === 'mama' && ms.members['mama']);
        if (mama) spawnBubble(mama, `Jom ${ev.label} sama-sama!`);
        setTicker(`🍽️ Masa ${ev.label}: semua yang berada di rumah berkumpul di meja makan.`);
      }

      function addMealMember(ch) {
        const ms = mealState;
        if (ms.members[ch.id] || (ms.served && ms.served[ch.id])) return;
        const seat = MEAL_SEATS[ms.seatIdx++ % MEAL_SEATS.length];
        const m = { seat, state: 'going', eatLeft: 0, tries: 0, retry: 0 };
        ms.members[ch.id] = m;
        if (ch.routine && ch.routine.type === 'wake') { m.state = 'wake'; return; } // sertai selepas siap mandi
        sendToSeat(ch, m);
      }

      function sendToSeat(ch, m) {
        ch.routine = { type: 'meal' };
        ch.routineLock = true;
        ch.routineLockT = 0;
        m.state = 'going';
        m.retry = 1.5;
        routineGo(ch, `Ke meja makan untuk ${mealState.event.label}`, 'eat', m.seat.c, m.seat.r, 'walk', 30);
      }

      function releaseMealMember(ch) {
        if (ch.needs) ch.needs.lapar = Math.min(ch.needs.lapar, 8);
        if (mealState.served) mealState.served[ch.id] = true;
        addMemory(ch, `Selesai ${mealState.event.label} bersama keluarga.`);
        clearRoutine(ch, true);
      }

      function updateMeals(dt, hourFloat) {
        const ms = mealState;
        const day = timeState.dayNumber;
        if (ms.phase === 'idle') {
          for (const ev of MEAL_EVENTS) {
            const key = day + ':' + ev.key;
            const hardEnd = isWorkday() ? ev.hardEndWork : ev.hardEnd;
            // Tunggu semua siap mandi/gosok gigi dahulu (maks. 1.5 jam selepas waktu mula)
            const anyWake = characters.some(c => c.routine && c.routine.type === 'wake');
            if (!ms.done[key] && hourFloat >= ev.start && hourFloat < hardEnd && (!anyWake || hourFloat >= ev.start + 1.5)) { startMeal(ev, key); break; }
          }
          return;
        }

        const ev = ms.event;
        const hardEnd = isWorkday() ? ev.hardEndWork : ev.hardEnd;
        if (hourFloat >= hardEnd || hourFloat < ev.start - 1) {
          // masa tamat paksa / masa dialihkan: lepaskan semua
          Object.keys(ms.members).forEach(id => {
            const ch = characters.find(c => c.id === id);
            if (ch && ch.routine && ch.routine.type === 'meal') releaseMealMember(ch);
            else if (ch) delete ms.members[id];
          });
          ms.members = {};
          ms.phase = 'idle';
          return;
        }

        ms.t += dt;
        // sertakan ahli yang baru tiba / baru bangun sebelum waktu 'late join' tamat
        characters.forEach(ch => { if (isEligibleForMeal(ch) && !ms.members[ch.id]) addMealMember(ch); });

        const ids = Object.keys(ms.members);
        ids.forEach(id => {
          const ch = characters.find(c => c.id === id);
          const m = ms.members[id];
          if (!ch || !isEligibleForMealOrRoutine(ch)) { if (ch && ch.routine && ch.routine.type === 'meal') clearRoutine(ch, true); delete ms.members[id]; return; }
          if (m.state === 'wake') return;
          if (m.state === 'going') {
            m.retry = Math.max(0, m.retry - dt);
            if (ch.path.length === 0) {
              const dTile = Math.hypot(ch.x - (m.seat.c + 0.5) * TILE, ch.y - (m.seat.r + 0.5) * TILE) / TILE;
              if (dTile <= 1.3 || m.tries >= 3) {
                m.state = 'seated';
                ch.actionMode = 'idle';
                ch.activity = `Duduk menunggu semua orang untuk ${ev.label}`;
                ch.activityKey = 'eat';
                ch.facing = (Math.floor(ch.x / TILE) <= 45) ? 1 : -1;
              } else if (m.retry <= 0) {
                m.tries++;
                m.retry = 1.5;
                routineGo(ch, `Ke meja makan untuk ${ev.label}`, 'eat', m.seat.c, m.seat.r, 'walk', 30);
              }
            }
          }
          if (m.state === 'seated' && ms.phase === 'eat') beginEating(ch, m);
          if (m.state === 'eating') {
            ch.actionMode = 'eat';   // sistem sembang boleh tukar label, tetapi watak tetap makan
            ch.activityKey = 'eat';
            m.eatLeft -= dt;
            if (m.eatLeft <= 0) { m.state = 'done'; releaseMealMember(ch); }
          }
        });

        if (ms.phase === 'gather') {
          const waiting = Object.values(ms.members);
          const allSeated = waiting.length > 0 && waiting.every(m => m.state === 'seated');
          if (waiting.length === 0) { ms.phase = 'idle'; return; }
          if (allSeated || ms.t >= GATHER_MAX_WAIT) {
            ms.phase = 'eat';
            setTicker(`🍽️ Semua berkumpul — ${ev.label} bersama keluarga bermula.`);
          }
        } else if (Object.keys(ms.members).length === 0) {
          ms.phase = 'idle';
        }
      }

      function isEligibleForMealOrRoutine(ch) {
        return ch.active && ch.visible && !ch.leavingHome && !(ch.id === 'papa' && ch.carPhase && ch.carPhase !== 'at_home');
      }

      function beginEating(ch, m) {
        m.state = 'eating';
        m.eatLeft = mealState.event.eatSec;
        ch.actionMode = 'eat';
        ch.activityKey = 'eat';
        ch.activity = `Makan ${mealState.event.label} bersama keluarga`;
        ch.timer = m.eatLeft + 1;
        ch.thought = generateThought(ch);
      }

      // Kunci Bilik Mandi asal hanya dikemas kini semasa setCharacterActivity() dipanggil, jadi 'occupant'
      // boleh tersangkut lama selepas orang itu keluar dan giliran tidak bergerak. Kemas kini setiap frame.
      function maintainRoomLocks() {
        Object.values(ROUTINE_ROOMS).forEach(room => {
          const L = room.lock;
          if (L.occupant) {
            const occ = characters.find(c => c.id === L.occupant);
            if (!occ || !occ.active || !occ.visible || !isInsideRect(occ, room.rect)) {
              if (occ) occ.lockType = null;
              L.occupant = null;
            }
          }
          L.queue = L.queue.filter(id => { const c = characters.find(x => x.id === id); return c && c.active && c.visible && !isInsideRect(c, room.rect); });
          if (!L.occupant) {
            const inside = characters.find(c => !c.isPet && c.active && c.visible && isInsideRect(c, room.rect));
            if (inside) { L.occupant = inside.id; inside.lockType = 'hygiene-room'; }
          }
          if (!L.occupant && L.queue.length > 0) {
            const nextCh = characters.find(c => c.id === L.queue[0]);
            L.queue.shift();
            if (nextCh) {
              const st = (nextCh.routine && nextCh.routine.type === 'wake') ? WAKE_ROUTINE_STEPS[nextCh.routine.step] : null;
              routineGo(nextCh, st ? st.label : `Masuk ke ${room.name}`, 'hygiene', st ? st.c : room.enter.c, st ? st.r : room.enter.r, 'idle', 7);
            }
          }
        });
      }

      function updateFamilyRoutines(dt) {
        maintainRoomLocks();
        const { hourFloat } = getCurrentClock();
        characters.forEach(ch => {
          if (ch.isPet) return;
          const asleep = ch.actionMode === 'sleep';
          if (ch._wasAsleep && !asleep && !ch.pendingSleep && !ch.routine && ch.active && ch.visible && !ch.leavingHome &&
              hourFloat >= 4 && hourFloat < 11) {
            startWakeRoutine(ch);
          }
          ch._wasAsleep = asleep;
          if (!ch.routine) return;
          if (!isEligibleForMealOrRoutine(ch)) { clearRoutine(ch, false); return; }
          ch.routineLockT = (ch.routineLockT || 0) + dt;
          if (ch.routineLockT > ROUTINE_SAFETY_MAX) { clearRoutine(ch, true); return; }
          if (ch.routine.type === 'wake') updateWakeRoutine(ch, dt);
        });
        updateMeals(dt, hourFloat);
      }

      function gatherFamilyActivity() {
        // Gather everyone at the center of the WFH office, not the dining table.
        const officeSpots = [
          { c: 19, r: 35 }, { c: 18, r: 35 }, { c: 20, r: 35 }, { c: 19, r: 34 },
          { c: 18, r: 34 }, { c: 20, r: 34 }, { c: 19, r: 36 }, { c: 18, r: 36 },
          { c: 20, r: 36 }, { c: 17, r: 35 }, { c: 21, r: 35 }, { c: 17, r: 34 },
          { c: 21, r: 34 }, { c: 17, r: 36 }, { c: 21, r: 36 }
        ];
        let idxSpot = 0;
        characters.forEach(ch => {
          if (!ch.active || !ch.visible || ch.leavingHome || ch.actionMode === 'sleep') return;
          if (ch.id === 'papa' && isPapaWorkTime()) return;
          if (ch.isPet) {
            setCharacterActivity(ch, 'Berkumpul berhampiran keluarga di Pejabat WFH', 'pets', 21, 37, false, 'idle', 10);
            return;
          }
          const sp = officeSpots[idxSpot++ % officeSpots.length];
          setCharacterActivity(ch, 'Berkumpul bersama keluarga di Pejabat WFH', 'chat', sp.c, sp.r, false, 'idle', 12);
          addMemory(ch, 'Berkumpul bersama keluarga di Pejabat WFH.');
        });
        setTicker('👨‍👩‍👦‍👦 Kumpul: keluarga berkumpul di tengah Pejabat WFH!');
      }

      function updateGateAndCar(dt) {
        if (FRONT_GATE.holdTimer > 0) {
          FRONT_GATE.holdTimer = Math.max(0, FRONT_GATE.holdTimer - dt);
          FRONT_GATE.openProgress = Math.min(1, FRONT_GATE.openProgress + dt * 2.4);
        } else {
          FRONT_GATE.openProgress = Math.max(0, FRONT_GATE.openProgress - dt * 1.8);
        }

        const papaShouldWork = isPapaWorkTime();
        const papa = characters.find(ch => ch.id === 'papa');

        if (papaShouldWork && familyCar.state === 'parked' && papa && papa.carPhase === 'at_home' && !papa.routineLock) {
          const papaWalking = papa.path && papa.path.length > 0 && papa.actionMode === 'walk';
          if (!papaWalking) {
            papa.carPhase = 'boarding_out';
            setCharacterActivity(papa, 'Berjalan ke kereta untuk ke pejabat (9AM-6PM)', 'work', 19, 46, false, 'idle', 8);
          }
        }

        if (!papaShouldWork && familyCar.state === 'away' && papa && papa.carPhase === 'at_work') {
          familyCar.state = 'driving_in';
          familyCar.x = 19.5 * TILE;
          familyCar.y = 63 * TILE;
          openFrontGate(5.5);
          setTicker('Pukul 6:00 PM: Papa memandu kereta pulang ke rumah! Pagar hadapan terbuka automatik.');
        }

        if (familyCar.state === 'driving_out') {
          openFrontGate(1.5);
          if (FRONT_GATE.openProgress > 0.65) {
            familyCar.y += 110 * dt;
            if (papa) {
              papa.x = familyCar.x;
              papa.y = familyCar.y;
            }
            if (familyCar.y > 64 * TILE) {
              familyCar.state = 'away';
              if (papa) {
                papa.carPhase = 'at_work';
                papa.visible = false;
                papa.activity = 'Bekerja di pejabat (9 AM - 6 PM)';
                papa.thought = generateThought(papa);
              }
            }
          }

      /* =========================================================================
         11. KAMERA, PAN, ZUM & KETIKAN INSPEKTOR / DEKORASI
         ========================================================================= */
      const canvas = document.getElementById('worldCanvas');
      const ctx = canvas.getContext('2d');

      const camera = {
        x: WORLD_W * 0.5,
        y: WORLD_H * 0.52,
        zoom: 1,
        minZoom: 0.35,
        maxZoom: 2.6
      };

      function computeFitZoom() {
        const vw = canvas.clientWidth || window.innerWidth;
        const vh = canvas.clientHeight || window.innerHeight;
        const topReserve = vh < 480 ? 52 : 64;
        const bottomReserve = vw < 600 && vh > vw ? 116 : 64;
        const availW = Math.max(180, vw - 16);
        const availH = Math.max(160, vh - topReserve - bottomReserve);
        const fit = Math.min(availW / WORLD_W, availH / WORLD_H);
        return Math.max(camera.minZoom, Math.min(1.6, fit));
      }

      function applyOrientationFitView() {
        camera.zoom = computeFitZoom();
        camera.x = WORLD_W * 0.5;
        camera.y = WORLD_H * 0.52;
        clampCamera();
      }

      function resizeCanvas() {
        const w = Math.max(1, canvas.clientWidth || window.innerWidth);
        const h = Math.max(1, canvas.clientHeight || window.innerHeight);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const pixelW = Math.floor(w * dpr);
        const pixelH = Math.floor(h * dpr);
        if (canvas.width !== pixelW || canvas.height !== pixelH) {
          canvas.width = pixelW;
          canvas.height = pixelH;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!camera._initialized) {
          applyOrientationFitView();
          camera._initialized = true;
        } else {
          clampCamera();
        }
      }

      function clampCamera() {
        const vw = canvas.clientWidth || window.innerWidth;
        const vh = canvas.clientHeight || window.innerHeight;
        const halfW = (vw * 0.5) / camera.zoom;
        const halfH = (vh * 0.5) / camera.zoom;
        const pad = 80;
        camera.x = Math.max(-pad + halfW * 0.35, Math.min(WORLD_W + pad - halfW * 0.35, camera.x));
        camera.y = Math.max(-pad + halfH * 0.35, Math.min(WORLD_H + pad - halfH * 0.35, camera.y));
      }

      function screenToWorld(sx, sy) {
        const vw = canvas.clientWidth || window.innerWidth;
        const vh = canvas.clientHeight || window.innerHeight;
        return {
          x: (sx - vw * 0.5) / camera.zoom + camera.x,
          y: (sy - vh * 0.5) / camera.zoom + camera.y
        };
      }

      function worldToScreen(wx, wy) {
        const vw = canvas.clientWidth || window.innerWidth;
        const vh = canvas.clientHeight || window.innerHeight;
        return {
          sx: (wx - camera.x) * camera.zoom + vw * 0.5,
          sy: (wy - camera.y) * camera.zoom + vh * 0.5
        };
      }

      function adjustZoom(factor) {
        camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * factor));
        clampCamera();
      }

      let pointerState = { down: false, moved: false, pointerId: null, startX: 0, startY: 0, camStartX: 0, camStartY: 0 };
      const activePointers = new Map();
      let pinchState = null;

      function resetPointerState() {
        pointerState.down = false;
        pointerState.moved = false;
        pointerState.pointerId = null;
      }

      function pointerDistance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function pointerMidpoint(a, b) {
        return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 };
      }

      function beginPinch() {
        const pts = [...activePointers.values()];
        if (pts.length < 2) return;
        const mid = pointerMidpoint(pts[0], pts[1]);
        pinchState = {
          startDistance: Math.max(1, pointerDistance(pts[0], pts[1])),
          startZoom: camera.zoom,
          anchorWorld: screenToWorld(mid.x, mid.y)
        };
        pointerState.moved = true;
        pointerState.down = false;
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

        if (activePointers.size >= 2 && [...activePointers.values()].some(p => p.type === 'touch')) {
          beginPinch();
          return;
        }

        pointerState.down = true;
        pointerState.moved = false;
        pointerState.pointerId = e.pointerId;
        pointerState.startX = e.clientX;
        pointerState.startY = e.clientY;
        pointerState.camStartX = camera.x;
        pointerState.camStartY = camera.y;
      });

      window.addEventListener('pointermove', (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
        }

        if (pinchState && activePointers.size >= 2) {
          const pts = [...activePointers.values()];
          const mid = pointerMidpoint(pts[0], pts[1]);
          const dist = Math.max(1, pointerDistance(pts[0], pts[1]));
          const vw = canvas.clientWidth || window.innerWidth;
          const vh = canvas.clientHeight || window.innerHeight;
          camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, pinchState.startZoom * (dist / pinchState.startDistance)));
          camera.x = pinchState.anchorWorld.x - (mid.x - vw * 0.5) / camera.zoom;
          camera.y = pinchState.anchorWorld.y - (mid.y - vh * 0.5) / camera.zoom;
          clampCamera();
          return;
        }

        if (!pointerState.down || (pointerState.pointerId !== null && e.pointerId !== pointerState.pointerId)) return;
        const dx = e.clientX - pointerState.startX;
        const dy = e.clientY - pointerState.startY;
        if (Math.hypot(dx, dy) > 6) pointerState.moved = true;
        if (pointerState.moved) {
          camera.x = pointerState.camStartX - dx / camera.zoom;
          camera.y = pointerState.camStartY - dy / camera.zoom;
          clampCamera();
        }
      });

      function finishPointer(e, allowTap = true) {
        if (!pointerState.down || (pointerState.pointerId !== null && e && e.pointerId !== pointerState.pointerId)) return;
        const wasTap = allowTap && !pointerState.moved;
        resetPointerState();
        if (wasTap && e) {
          const rect = canvas.getBoundingClientRect();
          const worldPt = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
          let hit = null;
          let bestDist = 26;
          for (const ch of characters) {
            if (!ch.active || !ch.visible) continue;
            const d = Math.hypot(worldPt.x - ch.x, worldPt.y - (ch.y - 6));
            if (d < bestDist) { bestDist = d; hit = ch; }
          }
          if (hit) {
            selectedEntityId = hit.id;
            setTicker(`${getMoodEmoji(hit.mood)} ${hit.name} (${hit.age}) • ${getCurrentRoomAt(hit.x, hit.y)}: ${hit.activity} — "${hit.thought}"`);
            activeDrawerTab = 'inspect';
            renderDrawer();
          }
        }
      }

      function removePointer(e, allowTap) {
        activePointers.delete(e.pointerId);
        if (pinchState) {
          pinchState = null;
          resetPointerState();
          if (activePointers.size === 1) {
            const [id, p] = [...activePointers.entries()][0];
            pointerState.down = true;
            pointerState.moved = true;
            pointerState.pointerId = id;
            pointerState.startX = p.x;
            pointerState.startY = p.y;
            pointerState.camStartX = camera.x;
            pointerState.camStartY = camera.y;
          }
          return;
        }
        finishPointer(e, allowTap);
      }

      window.addEventListener('pointerup', (e) => removePointer(e, true));
      window.addEventListener('pointercancel', (e) => removePointer(e, false));
      window.addEventListener('blur', () => {
        activePointers.clear();
        pinchState = null;
        resetPointerState();
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        adjustZoom(e.deltaY < 0 ? 1.12 : 0.89);
      }, { passive: false });

      /* =========================================================================
         12. RENDERER 2D PIKSEL, CAHAYA LAMPU MALAM, BBQ & GELEMBUNG UCAPAN
         ========================================================================= */
      const glowCache = new Map();
      function getCachedGlowCanvas(radius, rgbaColor) {
        const key = `${radius}_${rgbaColor}`;
        if (glowCache.has(key)) return glowCache.get(key);
        const off = document.createElement('canvas');
        off.width = radius * 2;
        off.height = radius * 2;
        const octx = off.getContext('2d');
        const grad = octx.createRadialGradient(radius, radius, 2, radius, radius, radius);
        grad.addColorStop(0, rgbaColor);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        octx.fillStyle = grad;
        octx.fillRect(0, 0, radius * 2, radius * 2);
        glowCache.set(key, off);
        return off;
      }

      function isRoomOccupied(rm) {
        return characters.some(c => {
          if (!c.active || !c.visible || c.isPet) return false;
          const tc = Math.floor(c.x / TILE);
          const tr = Math.floor(c.y / TILE);
          return tc >= rm.c1 && tc <= rm.c2 && tr >= rm.r1 && tr <= rm.r2;
        });
      }

      function drawWorld(nowSec) {
        const vw = canvas.clientWidth || window.innerWidth;
        const vh = canvas.clientHeight || window.innerHeight;

        ctx.fillStyle = '#0b1324';
        ctx.fillRect(0, 0, vw, vh);

        ctx.save();
        ctx.translate(vw * 0.5, vh * 0.5);

        ctx.translate(-camera.x, -camera.y);

        for (let r = 0; r < ROWS; r++) {

            } else if (cell === CELL_DRIVEWAY) {
              ctx.fillStyle = ((c + r) & 1) === 0 ? '#475569' : '#3e4c5e';
              ctx.fillRect(px, py, TILE, TILE);

        }

        ctx.strokeStyle = '#f8fafc';

        ctx.setLineDash([]);

        ROOMS.forEach(rm => {
          for (let r = rm.r1; r <= rm.r2; r++) {
            for (let c = rm.c1; c <= rm.c2; c++) {
              const cell = grid[idx(c, r)];
              const px = c * TILE;
              const py = r * TILE;
              if (cell === CELL_FLOOR_WOOD) {
                ctx.fillStyle = r % 2 === 0 ? '#e6be8a' : '#dfb47d';
                ctx.fillRect(px, py, TILE, TILE);
                ctx.fillStyle = 'rgba(120, 72, 28, 0.14)';
                ctx.fillRect(px, py + TILE - 2, TILE, 2);
              } else if (cell === CELL_FLOOR_TILE) {
                ctx.fillStyle = ((c + r) & 1) === 0 ? '#e2e8f0' : '#cbd5e1';

              }
            }

      function drawCharacter(ch, nowSec) {
        const s = ch.scale || 1;
        const isLyingOnBed = ch.actionMode === 'sleep' && !ch.isPet;
        // Bob licin (tanpa kink abs(sin)), amplitud kecil & koordinat dikunci ke piksel peranti
        // supaya sprite tidak 'shimmer' semasa bergerak.
        const walkingNow = ch.path.length > 0;
        const bob = isLyingOnBed ? 0 : (walkingNow ? (1 - Math.cos(ch.animPhase * 2)) * 0.8 : Math.sin(nowSec * 2 + ch.animPhase) * 0.8);
        const snapK = camera.zoom * Math.min(window.devicePixelRatio || 1, 2);
        const baseX = Math.round(ch.x * snapK) / snapK;
        const baseY = Math.round(ch.y * snapK) / snapK;
        let x = baseX;
        let y = Math.round((ch.y - bob) * snapK) / snapK;
        // Playground: anchor occupants to actual equipment, with visible activity cycles.
        if (!walkingNow && ch.activityKey === 'slide') {
          const sl = PLAYGROUND.slide;
          const phase = (nowSec * 0.72 + ch.animPhase * 0.17) % 1;
          // climb/queue at ladder -> slide along the chute -> return to ladder
          if (phase < 0.24) { x = sl.x - 13 * s; y = sl.y - 18 * s + Math.sin(phase / 0.24 * Math.PI) * 2 * s; }
          else if (phase < 0.78) { const t = (phase - 0.24) / 0.54; x = sl.x + (8 + t * 22) * s; y = sl.y - 8 * s + t * 17 * s; }
          else { const t = (phase - 0.78) / 0.22; x = sl.x - 13 * s; y = sl.y - 18 * s + (1 - t) * 3 * s; }
        } else if (!walkingNow && ch.activityKey === 'swing') {
          const sw = PLAYGROUND.swing;
          const swingPhase = Math.sin(nowSec * 3.2 + ch.animPhase);
          x = sw.x + swingPhase * 8 * s;
          y = sw.y - 3 * s + Math.abs(swingPhase) * 5 * s;
        } else if (!walkingNow && ch.activityKey === 'seesaw') {
          const ss = PLAYGROUND.seesaw;
          const kidIds = ['isaac','hayyan','zaef','ayden','aufa','alina','afiyah'];
          const seatSide = kidIds.includes(ch.id) ? (kidIds.indexOf(ch.id) % 2 ? 1 : -1) : (ch.animPhase % 2 ? -1 : 1);
          const rocking = Math.sin(nowSec * 2.35 + ch.animPhase);
          x = ss.x + seatSide * 19 * s;
          y = ss.y - 5 * s + rocking * seatSide * 5 * s;
        }

        if (!walkingNow && ch.activityKey === 'slide') {
          const slidePhase = (nowSec * 0.72 + ch.animPhase * 0.17) % 1;
          if (slidePhase >= 0.24 && slidePhase < 0.78) {
            const progress = (slidePhase - 0.24) / 0.54;
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath(); ctx.arc(x - 8 * s, y - 3 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();
          }
        }

        if (ch.id === selectedEntityId) {
          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(baseX, baseY + 2, 13 * s, 6 * s, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (ch.id === tagItCharacterId && ch.activityKey === 'tag') {
          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🎯 IT!', x, y - 44 * s);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
        ctx.beginPath();
        ctx.ellipse(baseX, baseY + 2, isLyingOnBed ? 16 * s : 10 * s, 4.5 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        if (isLyingOnBed) {
          ctx.fillStyle = ch.pantsColor || '#1e293b';
          ctx.fillRect(x - 12 * s, y - 6 * s, 8 * s, 6 * s);
          ctx.fillStyle = ch.shirtColor;
          ctx.beginPath();
          ctx.roundRect(x - 5 * s, y - 8 * s, 12 * s, 8 * s, 3 * s);
          ctx.fill();
          ctx.fillStyle = ch.skinColor;
          ctx.beginPath();
          ctx.arc(x + 11 * s, y - 5 * s, 6 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = ch.hijabi ? ch.hairColor : ch.hairColor;
          ctx.beginPath();
          ctx.arc(x + 10.5 * s, y - 6 * s, 6.2 * s, Math.PI * 0.6, Math.PI * 1.8);
          ctx.fill();
        } else if (ch.isPet) {
          if (ch.petType === 'cat') {
            ctx.fillStyle = ch.shirtColor;
            ctx.beginPath();
            ctx.ellipse(x, y - 6 * s, 9 * s, 5.5 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + ch.facing * 6 * s, y - 11 * s, 4.5 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + ch.facing * 4 * s, y - 14 * s);
            ctx.lineTo(x + ch.facing * 2 * s, y - 18 * s);
            ctx.lineTo(x + ch.facing * 6 * s, y - 15 * s);
            ctx.fill();
            ctx.strokeStyle = ch.shirtColor;
            ctx.lineWidth = 2 * s;
            ctx.beginPath();
            ctx.moveTo(x - ch.facing * 8 * s, y - 7 * s);
            ctx.quadraticCurveTo(x - ch.facing * 13 * s, y - 13 * s, x - ch.facing * 11 * s, y - 17 * s);
            ctx.stroke();
          } else {
            ctx.fillStyle = ch.shirtColor;
            ctx.beginPath();
            ctx.ellipse(x, y - 6 * s, 8 * s, 6 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + ch.facing * 5 * s, y - 11 * s, 4.5 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(x + ch.facing * 4 * s, y - 17 * s, 3 * s, 3 * s);
            ctx.fillStyle = '#facc15';
            ctx.fillRect(x + ch.facing * 8 * s, y - 11 * s, 4 * s, 2.5 * s);
          }
        } else {
          const stride = ch.path.length > 0 ? Math.sin(ch.animPhase) * 3 * s : 0;
          const seatedPlayPose = !walkingNow && ['swing','seesaw'].includes(ch.activityKey);
          ctx.fillStyle = ch.pantsColor || '#1e293b';
          if (seatedPlayPose) {
            // Bent legs hang from the seat instead of the usual standing pose.
            ctx.fillRect(x - 6 * s, y - 5 * s, 4 * s, 8 * s);
            ctx.fillRect(x + 2 * s, y - 5 * s, 4 * s, 8 * s);
            ctx.fillStyle = '#334155';
            ctx.fillRect(x - 7 * s, y + 1 * s, 5 * s, 2 * s);
            ctx.fillRect(x + 1 * s, y + 1 * s, 5 * s, 2 * s);
          } else {
            ctx.fillRect(x - 5 * s, y - 5 * s + stride * 0.4, 4 * s, 7 * s);
            ctx.fillRect(x + 1 * s, y - 5 * s - stride * 0.4, 4 * s, 7 * s);
          }

          ctx.fillStyle = ch.shirtColor;
          ctx.beginPath();
          ctx.roundRect(x - 7 * s, y - 15 * s, 14 * s, 11 * s, 3 * s);
          ctx.fill();
          // Play poses: visible arms reach toward swing chains / seesaw handles.
          ctx.strokeStyle = ch.shirtColor;
          ctx.lineWidth = 3 * s;
          ctx.lineCap = 'round';
          ctx.beginPath();
          if (seatedPlayPose) {
            const armSwing = Math.sin(nowSec * 3.2 + ch.animPhase) * 2 * s;
            ctx.moveTo(x - 6 * s, y - 12 * s); ctx.lineTo(x - 11 * s, y - 8 * s + armSwing);
            ctx.moveTo(x + 6 * s, y - 12 * s); ctx.lineTo(x + 11 * s, y - 8 * s - armSwing);
          } else {
            ctx.moveTo(x - 6 * s, y - 12 * s); ctx.lineTo(x - 9 * s, y - 5 * s + stride);
            ctx.moveTo(x + 6 * s, y - 12 * s); ctx.lineTo(x + 9 * s, y - 5 * s - stride);
          }
          ctx.stroke();

          if (ch.hijabi) {
            ctx.fillStyle = ch.hairColor;
            ctx.beginPath();
            ctx.arc(x, y - 19.5 * s, 8.2 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(x - 7.5 * s, y - 18 * s, 15 * s, 8 * s, 3 * s);
            ctx.fill();
            ctx.fillStyle = ch.skinColor;
            ctx.beginPath();
            ctx.arc(x, y - 19.5 * s, 5.3 * s, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = ch.skinColor;
            ctx.beginPath();
            ctx.arc(x, y - 20 * s, 6.8 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = ch.hairColor;
            ctx.beginPath();
            ctx.arc(x, y - 22 * s, 7 * s, Math.PI, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = '#0f172a';
          ctx.fillRect(x + (ch.facing * 2 - 2.5) * s, y - 20.5 * s, 1.8 * s, 2 * s);
          ctx.fillRect(x + (ch.facing * 2 + 1.2) * s, y - 20.5 * s, 1.8 * s, 2 * s);
        }

        if (ch.actionMode === 'sleep') {
          ctx.fillStyle = '#e0f2fe';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💤 zzz', x + 8 * s, y - 30 * s - ((nowSec * 8) % 6));
        }

        const labelText = ch.isPet ? `${ch.name.split(' ')[0]} ${getMoodEmoji(ch.mood)}` : `${ch.name} ${getMoodEmoji(ch.mood)}`;
        ctx.font = 'bold 9.5px sans-serif';
        const lw = ctx.measureText(labelText).width + 8;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
        ctx.beginPath();
        ctx.roundRect(baseX - lw * 0.5, baseY + 5, lw, 13, 5);
        ctx.fill();
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText(labelText, baseX, baseY + 14.5);
      }

      function drawSpeechBubbles(vw, vh) {
        if (activeBubbles.length === 0) return;
        ctx.save();
        activeBubbles.forEach(b => {
          const ch = characters.find(c => c.id === b.chId);
          if (!ch || !ch.active || !ch.visible) return;
          const s = ch.scale || 1;
          const { sx, sy } = worldToScreen(ch.x, ch.y - 36 * s);
          if (sx < -120 || sx > vw + 120 || sy < -80 || sy > vh + 80) return;

          ctx.globalAlpha = Math.max(0, Math.min(1, b.alpha));
          ctx.font = b.emojiOnly ? 'bold 14px sans-serif' : '600 10.5px sans-serif';
          const textW = ctx.measureText(b.text).width;
          const boxW = Math.min(230, Math.max(28, textW + 14));
          const boxH = b.emojiOnly ? 24 : 22;
          const bx = Math.max(8, Math.min(vw - boxW - 8, sx - boxW * 0.5));
          const by = Math.max(48, sy - boxH);

          ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
          ctx.strokeStyle = 'rgba(125, 211, 252, 0.65)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(bx, by, boxW, boxH, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#f8fafc';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.text, bx + boxW * 0.5, by + boxH * 0.5 + 0.5, boxW - 8);
        });
        ctx.restore();
      }

      function toggleAmbientSound() {

        const btn = document.getElementById('ambientSoundBtn');
        if (btn) btn.textContent = ambientEnabled ? '🔊 Bunyi' : '🔇 Bunyi';

        if (ambientEnabled) {
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (ambientTimer !== null) clearInterval(ambientTimer);
            ambientTimer = setInterval(() => {
              if (!ambientEnabled || !audioCtx || audioCtx.state !== 'running') return;
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sine';
              const notes = [261.63, 293.66, 329.63, 392.0, 440.0];
              osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
              gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.015, audioCtx.currentTime + 0.25);
              gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start();
              osc.stop(audioCtx.currentTime + 1.45);
            }, 3200);
          } catch (_) {}
        } else if (ambientTimer !== null) {
          clearInterval(ambientTimer);
          ambientTimer = null;
        }
      }

      document.getElementById('ambientSoundBtn').addEventListener('click', toggleAmbientSound);
      document.getElementById('zoomInBtn').addEventListener('click', () => adjustZoom(1.18));
      document.getElementById('zoomFitBtn').addEventListener('click', () => applyOrientationFitView());
      document.getElementById('zoomOutBtn').addEventListener('click', () => adjustZoom(0.84));


      // Weekend group-play scheduler: two shared activities per weekend day.
      const weekendGroupEventsDone = new Set();
      function updateWeekendGroupPlay() {
        const weekday = getWeekday();
        if (!['Sabtu', 'Ahad'].includes(weekday)) return;
        const { hourFloat } = getCurrentClock();
        const dayKey = `${timeState.dayNumber}`;
        const presentKids = characters.filter(c => c.active && c.visible && !c.isPet &&
          !c.leavingHome && c.actionMode !== 'sleep' &&
          (PROFILES[c.id]?.ageYears || 99) >= 3 && (PROFILES[c.id]?.ageYears || 99) < 13);
        if (presentKids.length < 3) return;

        if (hourFloat >= 10 && hourFloat < 11.5 && !weekendGroupEventsDone.has(`${dayKey}-morning`)) {
          weekendGroupEventsDone.add(`${dayKey}-morning`);
          startGroupKejarKejar();
          characters.filter(c => c.active && c.visible && !c.isPet && !c.leavingHome &&
            ['mama','papa','mummy_ngah','amaya'].includes(c.id) && c.actionMode !== 'sleep')
            .forEach(adult => {
              setCharacterActivity(adult, 'Menemani sepupu bermain kejar-kejar di halaman', 'play_kids', 37, 46, false, 'play', 7);
            });
          setTicker('🏃 Aktiviti hujung minggu: semua sepupu bermain kejar-kejar bersama!');
        }
        if (hourFloat >= 15 && hourFloat < 16.5 && !weekendGroupEventsDone.has(`${dayKey}-afternoon`)) {
          weekendGroupEventsDone.add(`${dayKey}-afternoon`);
          startGroupMasakMasak();
          characters.filter(c => c.active && c.visible && !c.isPet && !c.leavingHome &&
            ['mama','papa','mummy_ngah','amaya'].includes(c.id) && c.actionMode !== 'sleep')
            .forEach(adult => {
              setCharacterActivity(adult, 'Menyediakan permainan dan menemani kanak-kanak', 'play_kids', 35, 47, false, 'play', 7);
            });
          setTicker('🍳 Aktiviti hujung minggu: sepupu bermain masak-masak bersama!');
        }
      }
\n      let lastFrameMs = performance.now();
      let hudSyncAccum = 0;
      let isPausedByVisibility = false;
      let rafId = null;

      function simulationStep(nowMs) {
        if (isPausedByVisibility) {
          rafId = null;
          return;
        }

        const rawDt = Math.min(0.05, Math.max(0.001, (nowMs - lastFrameMs) / 1000));
        lastFrameMs = nowMs;

        const nightMult = getNightMultiplier();
        const simDt = rawDt * nightMult;
        const effectiveTimeScale = timeState.timeScale; // simDt sudah mengambil nightMult; elak gandaan dua pada keperluan

        timeState.virtualMinutes += (simDt * timeState.timeScale) / 60; // Konsisten 5 minit virtual / saat sebenar
        const newDay = Math.floor(timeState.virtualMinutes / 1440) + 1;
        if (newDay !== timeState.dayNumber) {
          timeState.dayNumber = newDay;
        }

        updateScheduledArrivalsAndDepartures(simDt);
        updateNightRoutine(simDt);
        updateFamilyRoutines(simDt);
        updateGateAndCar(simDt);
        updateAdultResponsibilities(simDt);

        characters.forEach(ch => updateCharacter(ch, simDt, effectiveTimeScale));

        interactionThrottleAccum += simDt;
        if (interactionThrottleAccum >= 1.1) {
          interactionThrottleAccum = 0;
          runSocialInteractionTick();
        }

        updateConversationsAndBubbles(rawDt);
        drawWorld(nowMs / 1000);

        hudSyncAccum += rawDt;
        if (hudSyncAccum >= 0.4) {
          hudSyncAccum = 0;
          updateHud();
          if (drawer.classList.contains('open') && activeDrawerTab === 'inspect') {
            renderInspectTab();
          }
        }

        rafId = requestAnimationFrame(simulationStep);
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
      });

      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          resizeCanvas();
          applyOrientationFitView();
        }, 120);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          isPausedByVisibility = true;
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        } else {
          isPausedByVisibility = false;
          lastFrameMs = performance.now();
          if (rafId === null) {
            rafId = requestAnimationFrame(simulationStep);
          }
        }
      });

      window.addEventListener('pagehide', () => {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        if (ambientTimer !== null) {
          clearInterval(ambientTimer);
          ambientTimer = null;
        }
        if (audioCtx && typeof audioCtx.close === 'function') {
          audioCtx.close().catch(() => {});
        }
      });

      resizeCanvas();
      rollVisitPlanForDay(timeState.dayNumber, true);
      updateHud();
      rafId = requestAnimationFrame(simulationStep);
    })();
  </script>
